patches:
  - name: lone-escape-wait
    kind: source
    purpose: >-
      Wait a set time for the rest of a key or mouse code after a lone trailing ESC
      before reporting the Esc key, so a read that splits right after the ESC of a mouse
      report gives no Esc, for a-tui.
    upstream_status: not-submitted
    drop_when: "Upstream crossterm waits for the rest of a sequence after a lone ESC (crossterm-rs/crossterm#993, #854)."
    scope:
      - src/event.rs
      - src/event/source/unix/tty.rs
      - src/event/source/unix/mio.rs
      - src/event/source/unix.rs
  - name: read-waker
    kind: source
    purpose: "Let a thread blocked in event::read be woken: a public ReadWaker, taken before the read starts, makes the read return ErrorKind::Interrupted, so a-tui can stop its input thread and hand the terminal to an editor without losing a key."
    upstream_status: not-submitted
    drop_when: Upstream crossterm exposes a way to wake a blocked synchronous read.
    scope:
      - src/**
  - name: lone-escape-blocking-read
    kind: source
    purpose: "Read a lone ESC as Esc once the escape wait passes on a blocking terminal: leave the read loop while an ESC is parked instead of reading again, which on stdin or /dev/tty waits for the next key, for a-tui."
    upstream_status: not-submitted
    drop_when: "The lone-escape-wait patch is dropped, or upstream crossterm waits for the rest of a sequence after a lone ESC (crossterm-rs/crossterm#993, #854)."
    scope:
      - src/event/source/unix/tty.rs
  - name: fork-tooling
    kind: tooling
    purpose: Own fork policy, generated evidence, and integration configuration.
    upstream_status: "inappropriate: downstream-only fork maintenance"
    drop_when: The downstream fork is retired.
    scope:
      - patches/fork.yaml
      - PATCHES.md
      - patches/downstream/**
      - mise.toml
